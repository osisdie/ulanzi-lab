# Weekly update PRs. Actions are pinned to commit SHAs, and Dependabot moves the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /plugin/com.ulanzi.nwpie.ulanziPlugin
    schedule: { interval: weekly }
    ignore:
      # koffi 3 ships per-OS binaries as optional packages (an install from WSL would drop the Windows one) and passes
      # pointers as BigInt; move to it deliberately, with win32.js, not as a routine bump.
      - dependency-name: koffi
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /services/voice-asr
    schedule: { interval: weekly }
    ignore:
      - dependency-name: av # faster-whisper 1.2.1 passes an argument PyAV 19 removed; lift this after faster-whisper updates
        versions: [">=19"]
