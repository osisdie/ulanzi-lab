name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]   # supported LTS lines, latest patch (check-latest)
        include:
          # Ulanzi Studio 3.4 runs plugins on its own bundled Node 20.12.2 (end of life): keep the plugin working there.
          - { os: windows-latest, node: 20.12.2 }
          - { os: macos-latest, node: 20.12.2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Node has current security fixes (not for the Studio-compat 20.12.2 jobs)
        if: matrix.node != '20.12.2'
        run: node plugin/com.ulanzi.nwpie.ulanziPlugin/src/node-floor.js
      - run: npm install --no-audit --no-fund
      - name: Unit tests (on macOS this also runs the JXA bridge through osascript)
        run: npm test
      - name: Smoke test (boot the runtime with this OS's backends)
        run: npm run smoke
      - name: Shell scripts (hook, statusLine, installer)
        if: runner.os != 'Windows'
        run: bash test/ci/shell-checks.sh

  wsl:
    name: wsl (Windows Node ↔ Ubuntu in WSL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
      - run: npm install --no-audit --no-fund
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: jq curl
      - name: Shell scripts inside WSL
        shell: wsl-bash {0}
        run: bash test/ci/shell-checks.sh
      - name: Plugin on Windows reaches the WSL distro (discovery, liveness, login shell)
        run: node test/ci/wsl-bridge.mjs
