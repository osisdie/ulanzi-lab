<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../libs/ulanzi-html/css/uspi.css"><title>ulanzi-lab</title></head>
<body><div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label">Style</div><select class="uspi-item-value select" name="style"><option value="mascot">Clawd mascot</option><option value="counter">Big counter</option></select></div>
<div class="uspi-item"><div class="uspi-item-label">Theme (all keys)</div><select class="uspi-item-value select" name="theme"><option value="classic">Classic dark</option><option value="neon">Neon</option><option value="glass">Glass</option></select></div>
<div class="uspi-item"><div class="uspi-item-label">Nag sound</div><select class="uspi-item-value select" name="nag"><option value="off">Off</option><option value="on">Every 60 s while waiting</option></select></div>
<div class="uspi-item"><div class="uspi-item-label"></div><div class="uspi-item-value" style="opacity:.7;font-size:11px">Press: focus the longest-waiting session (press again to cycle) · Hold: acknowledge all</div></div>
</form></div>
<script src="../libs/ulanzi-html/js/constants.js"></script>
<script src="../libs/ulanzi-html/js/eventEmitter.js"></script>
<script src="../libs/ulanzi-html/js/timers.js"></script>
<script src="../libs/ulanzi-html/js/utils.js"></script>
<script src="../libs/ulanzi-html/js/ulanziApi.js"></script>
<script src="./inspector.js"></script>
</body></html>
