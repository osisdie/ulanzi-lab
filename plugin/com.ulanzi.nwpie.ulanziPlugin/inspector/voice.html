<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../libs/ulanzi-html/css/uspi.css"><title>ulanzi-lab</title></head>
<body><div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label">Part</div><select class="uspi-item-value select" name="part"><option value="rec">Record / pause / resume</option><option value="save">Finish (keep recording only)</option><option value="finish">Finish + transcript</option><option value="cancel">Cancel (press twice)</option><option value="last">Last transcript (hold: folder)</option><option value="copy">Copy last transcript</option><option value="retry">Transcribe last recording again</option><option value="status">Speech-to-text status (press: start)</option><option value="lang">Language: 華語 / English / 台語 / auto</option><option value="folder">Recordings folder</option><option value="wide">Timer, level meter, transcript (wide)</option></select></div>
<div class="uspi-item"><div class="uspi-item-label"></div><div class="uspi-item-value" style="opacity:.7;font-size:11px">Windows: needs ffmpeg (winget install Gyan.FFmpeg) and the local speech-to-text service (services/voice-asr/install.sh in WSL). Files go to Documents\ulanzi-lab\voice.</div></div>
</form></div>
<script src="../libs/ulanzi-html/js/constants.js"></script>
<script src="../libs/ulanzi-html/js/eventEmitter.js"></script>
<script src="../libs/ulanzi-html/js/timers.js"></script>
<script src="../libs/ulanzi-html/js/utils.js"></script>
<script src="../libs/ulanzi-html/js/ulanziApi.js"></script>
<script src="./inspector.js"></script>
</body></html>
