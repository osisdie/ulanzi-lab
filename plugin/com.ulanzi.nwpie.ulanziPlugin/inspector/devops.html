<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../libs/ulanzi-html/css/uspi.css"><title>ulanzi-lab</title></head>
<body><div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label">Kind</div><select class="uspi-item-value select" name="kind"><option value="cr-mine">My PRs / MRs</option><option value="cr-reviews">Review requests</option><option value="mr-total">Board: open total</option><option value="mr-ci">Board: CI failed</option><option value="mr-conflict">Board: conflicts</option><option value="mr-stale">Board: idle ≥7d</option><option value="mr-repo">Board: repo (slot)</option><option value="mr-wide">Board: problem list (wide)</option><option value="gh-actions">GitHub Actions (repo)</option><option value="status-claude">Claude status</option><option value="status-github">GitHub status</option><option value="http">HTTP check</option><option value="docker">Docker</option><option value="n8n">n8n</option><option value="wide">My PRs/MRs list (wide)</option></select></div>
<div class="uspi-item"><div class="uspi-item-label">Slot</div><input class="uspi-item-value" name="slot" type="number" min="0" max="15" value="0" placeholder="0 = repo with most problems"></div>
<div class="uspi-item"><div class="uspi-item-label">Repo</div><input class="uspi-item-value" name="repo" value="" placeholder="owner/name (GitHub Actions)"></div>
<div class="uspi-item"><div class="uspi-item-label">URL</div><input class="uspi-item-value" name="url" value="" placeholder="https://… (HTTP check)"></div>
<div class="uspi-item"><div class="uspi-item-label">Label</div><input class="uspi-item-value" name="label" value="" placeholder="display name"></div>
<div class="uspi-item"><div class="uspi-item-label"></div><div class="uspi-item-value" style="opacity:.7;font-size:11px">GitLab (glab) or GitHub (gh) runs in WSL; pick it with ULANZI_LAB_FORGE in .env. Hold any DevOps key to refresh now.</div></div>
</form></div>
<script src="../libs/ulanzi-html/js/constants.js"></script>
<script src="../libs/ulanzi-html/js/eventEmitter.js"></script>
<script src="../libs/ulanzi-html/js/timers.js"></script>
<script src="../libs/ulanzi-html/js/utils.js"></script>
<script src="../libs/ulanzi-html/js/ulanziApi.js"></script>
<script src="./inspector.js"></script>
</body></html>
