<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../libs/ulanzi-html/css/uspi.css"><title>ulanzi-lab</title></head>
<body><div class="uspi-wrapper hidden"><form id="property-inspector">
<div class="uspi-item"><div class="uspi-item-label">Code</div><input class="uspi-item-value" name="code" value="2330" placeholder="2330 / t00 / NVDA / ^DJI / GC=F (comma list = strip)"></div>
<div class="uspi-item"><div class="uspi-item-label">Label</div><input class="uspi-item-value" name="label" value="" placeholder="optional; comma list for strips"></div>
<div class="uspi-item"><div class="uspi-item-label">Colors</div><select class="uspi-item-value select" name="colors"><option value="tw">TW: red up / green down</option><option value="us">US: green up / red down</option></select></div>
</form></div>
<script src="../libs/ulanzi-html/js/constants.js"></script>
<script src="../libs/ulanzi-html/js/eventEmitter.js"></script>
<script src="../libs/ulanzi-html/js/timers.js"></script>
<script src="../libs/ulanzi-html/js/utils.js"></script>
<script src="../libs/ulanzi-html/js/ulanziApi.js"></script>
<script src="./inspector.js"></script>
</body></html>
