<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ulanzi_lab preview</title>
<style>
  :root { --bg:#0b0e13; --panel:#141922; --fg:#e6edf3; --dim:#7d8590; --line:#252c37; --accent:#2d7ff9; --bad:#ff2d2d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:baseline; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header .meta { color:var(--dim); font-size:12px; }
  #alert { margin-left:auto; padding:4px 10px; border-radius:999px; font-weight:600; background:#1d2a1f; color:#3fb950; }
  #alert.on { background:var(--bad); color:#fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  main { display:grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap:20px; padding:20px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  .deck { display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; background:#05070a; padding:12px; border-radius:14px; }
  .key { aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:pointer; background:#111; border:1px solid #222; padding:0; }
  .key.wide { grid-column: span 2; aspect-ratio:2; }
  .key img { width:100%; height:100%; display:block; }
  .key:active { transform: scale(.96); }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  td.wrap { white-space:normal; word-break:break-all; }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button.btn { background:#1f2630; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }
  button.btn:hover { border-color:var(--accent); }
  .overflow { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>ulanzi_lab</h1>
  <span class="meta" id="meta">connecting…</span>
  <span id="alert">ALL CLEAR</span>
</header>
<main>
  <div style="display:grid;gap:20px;min-width:0">
    <div id="pages" style="display:grid;gap:20px;min-width:0"></div>
  </div>
  <div style="display:grid;gap:20px;align-content:start;min-width:0">
    <section>
      <h2>Claude sessions</h2>
      <div class="overflow"><table id="sessions"><thead><tr><th>Slot</th><th>Project</th><th>State</th><th>For</th><th>Tool</th><th>Ctx</th><th>Src</th><th></th></tr></thead><tbody></tbody></table></div>
      <div class="controls">
        <button class="btn" data-sim="start">+ fake session</button>
        <button class="btn" data-sim="perm">fake permission prompt</button>
        <button class="btn" data-sim="question">fake AskUserQuestion</button>
        <button class="btn" data-sim="stop">fake Stop</button>
        <button class="btn" data-sim="usage">fake usage</button>
        <button class="btn" id="nag">nag: off</button>
        <select class="btn" id="theme"><option value="classic">theme: classic</option><option value="neon">theme: neon</option><option value="glass">theme: glass</option></select>
        <button class="btn" data-sim="celebrate">mascot: celebrate</button>
        <button class="btn" data-sim="reset">reset</button>
      </div>
    </section>
    <section>
      <h2>Usage</h2>
      <div id="usage" class="hint">no statusLine data yet</div>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const post = (p, body) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json());
const COLORS = { idle:'#3a3f47', thinking:'#1fa3b8', working:'#2d7ff9', done:'#f5a623', error:'#d6336c', waiting:'#ff2d2d' };
const dur = (ms) => { const s = Math.round(ms/1000); return s < 60 ? s+'s' : s < 3600 ? Math.floor(s/60)+'m' : Math.floor(s/3600)+'h'+String(Math.floor(s/60)%60).padStart(2,'0'); };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const imgs = new Map();

const HINTS = {
  1: 'Click = press · Shift+click = long press',
  2: "Clicking here snaps this browser window itself (it's the foreground window).",
  3: 'Red = up, green = down (TW convention; set Colors = US in the key inspector to flip).',
};
function deckFor(page, names) {
  const n = Number(page.slice(1));
  let el = document.getElementById('deck' + n);
  if (el) return el;
  const sec = document.createElement('section');
  sec.dataset.order = n;
  sec.innerHTML = `<h2>Page ${n} · ${esc(names[n - 1] || '')}</h2><div class="deck" id="deck${n}"></div>` + (HINTS[n] ? `<div class="hint">${HINTS[n]}</div>` : '');
  const host = $('#pages');
  host.appendChild(sec);
  [...host.children].sort((a, b) => a.dataset.order - b.dataset.order).forEach(c => host.appendChild(c));
  return document.getElementById('deck' + n);
}
let st = {};
function renderKeys(keys) {
  for (const k of keys) {
    const page = k.ctx.split('___')[1];
    const host = deckFor(page, st.pageNames || []);
    let el = imgs.get(k.ctx);
    if (!el) {
      el = document.createElement('button');
      el.className = 'key' + (k.key === '3_2' ? ' wide' : '');
      el.title = `${k.action} ${JSON.stringify(k.settings)}`;
      el.innerHTML = '<img alt="">';
      el.onclick = (e) => post('/press', { ctx: k.ctx, long: e.shiftKey });
      el.dataset.order = (+k.key.split('_')[1]) * 10 + (+k.key.split('_')[0]);
      host.appendChild(el);
      [...host.children].sort((a, b) => a.dataset.order - b.dataset.order).forEach(c => host.appendChild(c));
      imgs.set(k.ctx, el);
    }
    if (k.svg && el._svg !== k.svg) { el._svg = k.svg; el.firstChild.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(k.svg); }
  }
}

function render(state) {
  st = state;
  $('#meta').textContent = `${st.sessions.length} sessions · updated ${new Date(st.now).toLocaleTimeString()}`;
  const w = st.counts.waiting;
  $('#alert').textContent = w ? `⚑ ${w} WAITING` : 'ALL CLEAR';
  $('#alert').classList.toggle('on', w > 0);
  document.title = w ? `(${w}) ⚑ ulanzi_lab` : 'ulanzi_lab preview';
  $('#nag').textContent = 'nag: ' + (st.nag ? 'on' : 'off');
  $('#nag').dataset.on = st.nag ? '1' : '';
  if (document.activeElement !== $('#theme')) $('#theme').value = st.theme || 'classic';
  renderKeys(st.keys);
  $('#sessions tbody').innerHTML = st.sessions.map(s => {
    const c = COLORS[s.state] || '#555';
    const label = s.state === 'waiting' ? `waiting · ${s.kind}` : s.state;
    return `<tr><td>S${s.slot ?? '-'}</td><td class="wrap">${esc(s.project)}</td>
      <td><span class="pill" style="background:${c}22;color:${c}">${esc(label)}</span></td>
      <td>${dur(st.now - (s.waitingSince || s.since))}</td><td>${esc(s.tool || '')}</td>
      <td>${s.ctxPct != null ? Math.round(s.ctxPct) + '%' : ''}</td><td>${esc(s.focus?.src || '')}${s.focus?.tmux_pane ? ' ' + esc(s.focus.tmux_pane) : ''}</td>
      <td><button class="btn" onclick="post('/focus',{id:'${esc(s.id)}'})">focus</button></td></tr>`;
  }).join('') || '<tr><td colspan="8" class="hint">no sessions. Start claude in WSL, or click “+ fake session”</td></tr>';
  const u = st.usage;
  const win = (n, x) => x ? `<b>${n}</b> ${Math.round(x.used_percentage)}% · resets ${new Date(x.resets_at * 1000).toLocaleString()}` : `<b>${n}</b> --`;
  $('#usage').innerHTML = `${win('5h', u.five_hour)}<br>${win('7d', u.seven_day)}<br>${u.model ? esc(u.model) + ' · ' : ''}${u.cost != null ? 'session $' + u.cost.toFixed(2) : ''}`;
}

let fakeN = 0;
const fakeIds = () => [...document.querySelectorAll('#sessions tbody tr')].length;
document.querySelectorAll('[data-sim]').forEach(b => b.onclick = async () => {
  const st = await fetch('/state').then(r => r.json());
  const fakes = st.sessions.filter(s => s.id.startsWith('fake-'));
  const pick = fakes[Math.floor(Math.random() * fakes.length)];
  const ev = (id, name, extra) => post('/hook', { session_id: id, hook_event_name: name, cwd: '/home/dev/' + id.replace('fake-', 'demo-'), ts: Date.now(), focus: { src: 'fake' }, ...extra });
  switch (b.dataset.sim) {
    case 'start': { const id = 'fake-' + (++fakeN) + '-' + Math.random().toString(36).slice(2, 6); await ev(id, 'SessionStart'); await ev(id, 'PreToolUse', { tool_name: 'Edit' }); break; }
    case 'perm': if (pick) await ev(pick.id, 'Notification', { notification_type: 'permission_prompt', tool_name: 'Bash' }); break;
    case 'question': if (pick) await ev(pick.id, 'PreToolUse', { tool_name: 'AskUserQuestion', tool_use_id: 'tu_' + Date.now() }); break;
    case 'stop': if (pick) await ev(pick.id, 'Stop'); break;
    case 'usage': await post('/usage', { session_id: pick?.id, rate_limits: { five_hour: { used_percentage: Math.random() * 100, resets_at: Date.now() / 1000 + 7200 }, seven_day: { used_percentage: Math.random() * 100, resets_at: Date.now() / 1000 + 400000 } }, context_window: { used_percentage: Math.round(Math.random() * 90) }, cost: { total_cost_usd: Math.random() * 5 }, model: { display_name: 'Opus 5.5' } }); break;
    case 'reset': await post('/reset'); break;
    case 'celebrate': await post('/mascot', { mood: 'celebrate' }); break;
  }
});
$('#nag').onclick = () => post('/nag', { enabled: !$('#nag').dataset.on });
$('#theme').onchange = (e) => post('/theme', { name: e.target.value });

const es = new EventSource('/events');
es.onmessage = (e) => render(JSON.parse(e.data));
es.onerror = () => { $('#meta').textContent = 'disconnected, retrying…'; };
</script>
</body>
</html>
